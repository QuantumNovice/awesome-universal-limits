name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Fonts (Liberation Serif stands in for Times New Roman)
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check src tests tools
          uv run ruff format --check src tests tools
      - name: Validate data and test limits
        run: uv run pytest -q
      - name: Generated files are up to date
        run: |
          uv run python -m allowed_universe.build
          git diff --exit-code -- data/schema data/json site/public/limits.json docs/REFERENCES.md docs/references.bib README.md
      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: |
            site/public/data
            site/public/figures

  site:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-data
          path: site/public
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Type-check and build
        working-directory: site
        run: |
          npm ci
          npm run build
