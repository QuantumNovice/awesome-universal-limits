[project]
name = "the-allowed-universe"
version = "0.1.0"
description = "Log-log plots that place real objects inside the bounds physics allows."
readme = "README.md"
license = "MIT"
authors = [{ name = "QuantumNovice" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.15",  # CODATA 2022 constants
    "matplotlib>=3.8",
    "pandas>=2.1",
    "jsonschema>=4.20",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allowed_universe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
